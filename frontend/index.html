<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RT Water Solution : traitement de l'eau au Cameroun</title>
    <meta name="description" content="RT Water Solution : traitement de l'eau à Yaoundé. Filtres, osmoseurs, adoucisseurs, installation et maintenance au Cameroun. Devis gratuit, paiement Mobile Money." />
    <meta name="theme-color" content="#0077BE" />

    <!-- Police Montserrat : connexion anticipée pour un affichage plus rapide -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Icônes et application installable -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Aperçus de lien (WhatsApp, Facebook, LinkedIn) ; chaque page les précise ensuite -->
    <meta property="og:site_name" content="RT Water Solution" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RT Water Solution : traitement de l'eau au Cameroun" />
    <meta property="og:description" content="Filtres, osmoseurs, adoucisseurs, installation et maintenance à Yaoundé. Devis gratuit." />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Données d'entreprise pour Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "RT Water Solution",
        "description": "Traitement de l'eau : filtration, osmose inverse, adoucissement, installation et maintenance.",
        "address": { "@type": "PostalAddress", "addressLocality": "Yaoundé", "addressCountry": "CM" },
        "areaServed": "CM",
        "currenciesAccepted": "XAF",
        "paymentAccepted": "Orange Money, MTN Mobile Money, Espèces"
      }
    </script>
  </head>

  <body>
    <noscript>
      Le site RT Water Solution a besoin de JavaScript. Contactez-nous au besoin par téléphone ou par e-mail.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
