<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 52" fill="none" role="img" aria-label="RT Water Solution">
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077BE"/>
      <stop offset="100%" stop-color="#00A8E8"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="44" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0077BE" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Water drop shape -->
  <path
    d="M22 1.5 C22 1.5 2 22 2 33 C2 43.5 11 50.5 22 50.5 C33 50.5 42 43.5 42 33 C42 22 22 1.5 22 1.5Z"
    fill="url(#dropGrad)"
    filter="url(#shadow)"
  />

  <!-- Internal shine highlight -->
  <path
    d="M14 12 C16 8 20 6 22 5"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.4"
  />

  <!-- Wave decoration -->
  <path
    d="M5 36 Q10 30 16 36 Q22 42 28 36 Q34 30 39 34"
    stroke="url(#waveGrad)"
    stroke-width="1.8"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- RT text -->
  <text
    x="22"
    y="32"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="white"
    font-size="16"
    font-weight="800"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    letter-spacing="0.5"
  >RT</text>
</svg>
